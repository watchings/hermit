name: Hermes Runtime Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag to create or replace
        required: true
        default: hermes-runtime-v1
        type: string
      prerelease:
        description: Mark the runtime release as prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    name: Publish Hermes runtime bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      BUNDLE_ASSET: hermes-runtime-aarch64.tar.gz
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Pull AArch64 Python image
        shell: bash
        run: docker pull --platform linux/arm64 python:3.12-bookworm

      - name: Build Hermes runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --file tools/hermes_runtime/Dockerfile.runtime \
            --build-arg PYTHON_IMAGE=python:3.12-bookworm \
            --tag hermes-runtime:build \
            --load \
            .

      - name: Export runtime image
        shell: bash
        run: |
          set -euo pipefail
          bash tools/hermes_runtime/build_release_bundle.sh

      - name: Create or replace runtime release
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hermes runtime $RELEASE_TAG" \
            --notes "Hash-verified Ubuntu AArch64 PRoot runtime for Hermit. See manifest.json and LICENSES.txt." \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            "release-cache/$BUNDLE_ASSET" \
            "release-cache/$BUNDLE_ASSET.sha256" \
            "release-cache/manifest.json" \
            "release-cache/requirements-aarch64.lock" \
            "release-cache/LICENSES.txt"
